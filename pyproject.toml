[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tof-tracker"
version = "0.0.0"
description = "ToF-based tracking algorithm with local training and development tools"
readme = "README.md"
dependencies = ["numpy>=2.0", "torch==2.9.1"]

[project.optional-dependencies]
viewer = ["plotly==7.1.0"]
gpu = ["warp-lang==1.15.0"]

# One development installation. These modules are not separate products,
# and this package list does not define the deployed algorithm artifacts.
[tool.setuptools]
packages = ["tof_tracker", "training", "devtools"]

[tool.setuptools.package-dir]
tof_tracker = "src/tof_tracker"
training = "training"
devtools = "devtools"

[tool.pyright]
extends = ".vscode/pyrightconfig.json"
